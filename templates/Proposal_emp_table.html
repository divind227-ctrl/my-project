<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>proposal_emp_details</title>
    <style>
        /* Main container for both sides */
        .main-container {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            padding-left: 20px;
            padding-top: 100px;
        }
        
        /* Left and Right side containers */
        .left-side-container, .right-side-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        
        /* Optionally, adjust the left side container margin for individual spacing */
        .left-side-container {
            margin-left: 30px;
        }
        
        /* ID card styling */
        .box {
            width: 600px;
            height: 145px;
            gap: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            padding: 15px;
            align-items: center;
        }
        
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
        }
        
        .photo img {
            width: 75px;
            height: 95px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .hod {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 0px;
        }
        
        .name-score {
            font-size: 11px;
        }
        
        .table-container {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        
        .table-container-pending {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        
        table {
            width: 50%;
            height: 60px;
            border-collapse: collapse;
            padding: 8px;
        }
        
        td {
            border: 2px solid #ccc;
            padding: 8px;
            width: 50%;
            font-size: 13px;
        }
        
        /* Grid layout for the right side */
        .right-side-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        /* Date form styling */
        .date-form {
            margin: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            display: flex;
            gap: 10px;
        }
        
        .date-container {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
        }
        
        .labels {
            font-size: 12px;
        }
        
        .date-input {
            padding: 5px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .submit-button {
            padding: 6px 12px;
            font-size: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .submit-button:hover {
            background-color: #45a049;
        }


        .center-div {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Mobile view adjustments */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                padding-left: 10px;
                padding-top: 50px;
            }
        
            /* Left and Right side containers */
            .left-side-container, .right-side-container {
                margin-left: 0;
                flex: none;
            }
        
            /* Adjusting ID card width */
            .box {
                width: 100%;
                height: auto;
                flex-direction: column;
                padding: 10px;
            }
        
            .photo img {
                width: 60px;
                height: 80px;
            }
        
            .table-container {
                flex-direction: column;
                width: 100%;
            }
        
            .table-container-pending {
                flex-direction: column;
                width: 100%;
            }
        
            table {
                width: 100%;
                height: auto;
                border-collapse: collapse; /* Ensures borders collapse neatly */
            }
        
            td {
                width: 50%;
                font-size: 12px;
                padding: 10px; /* Increased padding for better spacing */
                border: 1px solid #ccc;
            }
        
            /* Adjust grid layout for smaller screens */
            .right-side-container {
                grid-template-columns: 1fr; /* Single column layout */
            }
        
            /* Date form styling */
            .date-form {
                position: static;
                margin: 20px 0;
                padding: 10px;
                width: 100%;
            }
        
            .date-container {
                flex-direction: column;
            }
        
            .date-input {
                width: 100%;
            }
        
            .submit-button {
                width: 100%;
                padding: 6px 12px; /* Smaller padding */
                font-size: 12px; /* Adjusted font size for better readability */
            }
        }
        
        @media (max-width: 480px) {
            /* Further adjustments for very small screens */
            .main-container {
                padding-left: 5px;
                padding-top: 30px;
            }
        
            .box {
                padding: 5px;
            }
        
            .photo img {
                width: 50px;
                height: 70px;
            }
        
            .hod, .name-score {
                font-size: 7px;
            }
        
            .submit-button {
                width: 100%;
                padding: 4px 8px; /* Smaller padding for very small screens */
                font-size: 10px; /* Smaller font size */
            }
        
            table {
                width: 100%;
                font-size: 12px;
                border-collapse: collapse; /* Ensures borders collapse neatly */
            }
        
            td {
                font-size: 12px;
                padding: 8px; /* Adjust padding to make content readable */
                border: 1px solid #ccc;
            }
        
            /* Adjust table cell padding for small screens */
            table td {
                padding: 8px; /* Increased padding for clarity */
            }
        }
        
        
    </style>
    
</head>
<body>
    <!-- Date form for selecting from and to date, positioned at the top left -->
    <form method="POST" action='/proposal_emp_table' class="date-form">
        <div class="date-container">
            <div>
                <label for="from-date" class="labels">From Date:</label>
                <input type="date" id="from-date" name="from_date" class="date-input">
            </div>
            <div>
                <label for="to-date" class="labels">To Date:</label>
                <input type="date" id="to-date" name="to_date" class="date-input">
            </div>
        </div>
        <button type="submit" class="submit-button">Submit</button>
    </form>
    <!-- Right side container (for 6 ID cards) -->
    <div class="main-container">
        <div class="right-side-container">
            <!-- ID card #1 -->
            <div class="box">
                <div class="left-side">
                    <div class="photo">
                        <img src="{{ url_for('static', filename='images/Raja  947.jpg') }}" alt="ID Photo">
                    </div>
                    <div class="hod">HOD</div>
                    <div class="name-score">
                        <div id="RAJA_propo_name"></div>
                        <div>Score: 85%</div>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <tr>
                            <td>Task count:</td>
                            <td><div id="RAJA_propo_task_count"></div></td>
                        </tr>
                        <tr>
                            <td>Activities Sheet:</td>
                            <td><div id="RAJA_propo_acti_count"></div></td>
                        </tr>
                        <tr>
                            <td>Absent count:</td>
                            <td><div id="RAJA_propo_absent_count"></div></td>
                        </tr>
                        <tr>
                            <tr>
                                <td>late Count:</td>
                                <td><div id="RAJA_propo_Late_count"></div></td>
                            </tr>
                        </tr>
                    </table>

                    <table>
                        <tr>
                            <td>Task score:</td>
                            <td><div id="RAJA_propo_task_score"></div></td>
                        </tr>
                        <tr>
                            <td>Proposal Request pending:</td>
                            <td><div id="Proposal_Request_pending"></div></td>
                        </tr>
                        <tr>
                            <td>Incident count:</td>
                            <td><div id="RAJA_propo_incident"></div></td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- ID card #2 -->
            <div class="box">
                <div class="left-side">
                    <div class="photo">
                        <img src="{{ url_for('static', filename='images/Sreerag.jpeg') }}" alt="ID Photo">
                    </div>
                    <div class="name-score">
                        <div id="SREERAG_propo_name"></div>
                        <div>Score: 85%</div>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <tr>
                            <td>Task count:</td>
                            <td><div id="SREERAG_propo_task_count"></div></td>
                        </tr>
                        <tr>
                            <td>Activities Sheet:</td>
                            <td><div id="SREERAG_propo_acti_count"></div></td>
                        </tr>
                        <tr>
                            <td>Absent count:</td>
                            <td><div id="SREERAG_propo_absent_count"></div></td>
                        </tr>
                        <tr>
                            <td>late Count:</td>
                            <td><div id="SREERAG_propo_Late_count"></div></td>
                        </tr>
                    </table>

                    <table>
                        <tr>
                            <td>Task score:</td>
                            <td><div id="SREERAG_propo_task_score"></div></td>
                        </tr>
                        <tr>
                            <td>Incident count:</td>
                            <td><div id="SREERAG_propo_incident"></div></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // The employee data passed from Flask
            var proposalData = {{ proposal_data | tojson }};
            
            if (proposalData) {
                const poCreatedCount = proposalData.po_created_count || 0;
                const poApprovedHodCount = proposalData.po_approved_hod_count || 0;
                const poApprovedEdCount = proposalData.po_approved_ed_count || 0;
                const totalPoPending = poCreatedCount + poApprovedHodCount + poApprovedEdCount;
                const resultStringpo = `${poCreatedCount} + ${poApprovedHodCount} + ${poApprovedEdCount} = ${totalPoPending}`;
                document.getElementById("Proposal_Request_pending").innerText = resultStringpo;
                document.getElementById("RAJA_propo_name").innerText = proposalData.RAJA_propo;
                document.getElementById("RAJA_propo_task_count").innerText = proposalData.RAJA_propo_task_count;
                document.getElementById("RAJA_propo_acti_count").innerText = proposalData.RAJA_propo_acti_count;
                document.getElementById("RAJA_propo_absent_count").innerText = proposalData.RAJA_propo_absent_count;
                document.getElementById("RAJA_propo_Late_count").innerText = proposalData.RAJA_propo_Late_count;
                document.getElementById("RAJA_propo_task_score").innerText = proposalData.RAJA_propo_task_score;
                const RAJA_propo_positive_inc_count = proposalData.RAJA_propo_positive_inc_count || 0;
                const RAJA_propo_negative_inc_count = proposalData.RAJA_propo_negative_inc_count || 0;
                const RAJA_propo_total_inc_count = RAJA_propo_positive_inc_count + RAJA_propo_negative_inc_count;
                const RAJA_propo_incident = `pos ${RAJA_propo_positive_inc_count} + neg ${RAJA_propo_negative_inc_count} = ${RAJA_propo_total_inc_count}`;
                document.getElementById("RAJA_propo_incident").innerText = RAJA_propo_incident;


                document.getElementById("SREERAG_propo_name").innerText = proposalData.SREERAG_propo;
                document.getElementById("SREERAG_propo_task_count").innerText = proposalData.SREERAG_propo_task_count;
                document.getElementById("SREERAG_propo_acti_count").innerText = proposalData.SREERAG_propo_acti_count;
                document.getElementById("SREERAG_propo_absent_count").innerText = proposalData.SREERAG_propo_absent_count;
                document.getElementById("SREERAG_propo_Late_count").innerText = proposalData.SREERAG_propo_Late_count;
                document.getElementById("SREERAG_propo_task_score").innerText = proposalData.SREERAG_propo_task_score;
                const SREERAG_propo_positive_inc_count = proposalData.SREERAG_propo_positive_inc_count || 0;
                const SREERAG_propo_negative_inc_count = proposalData.SREERAG_propo_negative_inc_count || 0;
                const SREERAG_propo_total_inc_count = SREERAG_propo_positive_inc_count + SREERAG_propo_negative_inc_count;
                const SREERAG_propo_incident = `pos ${SREERAG_propo_positive_inc_count} + neg ${SREERAG_propo_negative_inc_count} = ${SREERAG_propo_total_inc_count}`;
                document.getElementById("SREERAG_propo_incident").innerText = SREERAG_propo_incident;





              
              


            }
        };
    
    </script>
</body>
</html>
