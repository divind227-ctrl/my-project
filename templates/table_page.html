            display: flex;

        .id-card {
            width: 500px;               
            height: 110px;              
            background-color: #fff;    
            border: 1px solid #ccc;     
            border-radius: 10px;        
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
            display: flex;              
            padding: 15px;              
            align-items: center;        
        }

        .photo {
            width: 80px;                
            height: 80px;                
            background-color: #e0e0e0;  
            border-radius: 8px;         
            display: flex;
            justify-content: center;     
            align-items: center;         
            margin-right: 15px;          
        }

        .photo img {
            width: 100%;                 
            height: 100%;               
            object-fit: cover;           
            border-radius: 8px;          
        }

        .table-container {
            display: flex;              
            gap: 10px;                  
            width: 100%;                
        }

        table {
            width: 50%;                 
            height: 120px;              
            border-collapse: collapse;  
            padding: 8px;

        td {

            padding: 10px;              
            width: 50%;

    </style>
